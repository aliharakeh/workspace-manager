version: '3'

info:
  companyName: Ali Harakeh
  productName: Workspace Manager
  productIdentifier: com.aliharakeh.workspace-manager
  description: Manage development workspaces and apps
  version: 0.0.1

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, build/bin, vscode]
    file: ["*_test.go", "*.syso"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
